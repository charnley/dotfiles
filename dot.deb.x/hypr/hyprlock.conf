# hyprlock config — minimal dark lock screen
# See: https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/

general {
    disable_loading_bar = true
    hide_cursor         = true
    grace               = 0
    no_fade_in          = true
}

background {
    monitor =
    color   = rgba(131313ff)
}

input-field {
    monitor =
    size    = 300, 50
    outline_thickness = 3

    col.outer          = rgba(0373bbff)
    col.inner          = rgba(121212ff)
    col.text           = rgba(ffffffff)
    col.fail           = rgba(900000ff)
    col.outer.fail     = rgba(900000ff)

    inner_color        = rgba(121212ff)
    font_color         = rgba(ffffffff)

    placeholder_text   = <span foreground="##888888">password</span>
    dots_center        = true

    position   = 0, -100
    halign     = center
    valign     = center
}

label {
    monitor =
    text    = cmd[update:1000] echo "$(date '+%H:%M')"
    color   = rgba(049cfbff)
    font_size = 48
    font_family = mononoki

    position = 0, 100
    halign   = center
    valign   = center
}

label {
    monitor =
    text    = cmd[update:60000] echo "$(date '+%Y-%m-%d')"
    color   = rgba(888888ff)
    font_size = 18
    font_family = mononoki

    position = 0, 40
    halign   = center
    valign   = center
}
