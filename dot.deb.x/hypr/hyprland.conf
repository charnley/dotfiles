# Hyprland config — mirrors i3/aerospace setup
# See: https://wiki.hypr.land/configuring/

################
### MONITORS ###
################

# Generic setup: primary monitor auto-detected
# When a second monitor is connected, workspace 10 binds to it
# Run `hyprctl monitors` to find connector names (e.g. HDMI-A-1, DP-1)
monitor = , preferred, auto, 1

# Workspace bindings: 1-9 on primary, 10 on secondary
# Uncomment and set the secondary connector name when using dual monitors:
# monitor = DP-1, preferred, auto, 1
# workspace = 10, monitor:DP-1


###################
### AUTOSTART   ###
###################

exec-once = nm-tray
exec-once = blueman-applet
exec-once = waybar
exec-once = swaybg -c '#131313'
exec-once = hypridle

# Disable bell
exec-once = xset -b


#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland


#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in  = 6
    gaps_out = 6

    border_size = 4

    col.active_border   = rgba(0373bbff)
    col.inactive_border = rgba(222222ff)

    resize_on_border = false
    allow_tearing    = false

    layout = dwindle
}

decoration {
    rounding = 0

    active_opacity   = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = false
    }

    blur {
        enabled = false
    }
}

animations {
    enabled = false
}

dwindle {
    preserve_split = true
    force_split    = 0
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo   = true
    focus_on_activate       = false
}


#############
### INPUT ###
#############

input {
    kb_layout  = us
    kb_options = caps:super

    follow_mouse = 0        # 0 = focus does NOT follow mouse (matches i3 config)
    sensitivity  = 0
}


###################
### KEYBINDINGS ###
###################

$mod = SUPER

# Terminal
bind = $mod, Return, exec, alacritty

# Launcher
bind = $mod, D,     exec, rofi -show run
bind = $mod, space, exec, rofi -show run

# Kill window
bind = $mod, Q,       killactive
bind = $mod SHIFT, Q, killactive

# Fullscreen
bind = $mod, F, fullscreen, 0

# Split direction (dwindle)
bind = $mod, H, layoutmsg, togglesplit
bind = $mod, V, layoutmsg, togglesplit

# Layout toggle
bind = $mod, E, layoutmsg, togglesplit

# Float toggle
bind = $mod SHIFT, space, togglefloating

# Focus movement
bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d

# Window movement
bind = $mod SHIFT, left,  movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up,    movewindow, u
bind = $mod SHIFT, down,  movewindow, d

# Scratchpad
bind = $mod SHIFT, minus,  movetoworkspace, special:scratchpad
bind = $mod SHIFT, Return, togglespecialworkspace, scratchpad

# Workspace switching (1-9 and 0=10)
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# Move window to workspace
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Resize submap (like i3's resize mode)
bind = $mod, R, submap, resize

submap = resize
binde = , right, resizeactive,  50   0
binde = , left,  resizeactive, -50   0
binde = , up,    resizeactive,   0 -50
binde = , down,  resizeactive,   0  50
bind  = , Return, submap, reset
bind  = , escape, submap, reset
submap = reset

# Lock screen
bind = $mod, L,       exec, hyprlock
bind = $mod SHIFT, L, exec, hyprlock && systemctl suspend

# Reload / exit
bind = $mod SHIFT, C, exec, hyprctl reload
bind = $mod SHIFT, E, exec, hyprctl dispatch exit

# Screenshots
bind = , Print,     exec, grimblast save output ~/img/screenshots/$(date +%Y-%m-%d_%H%M%S).png
bind = $mod, Print, exec, grimblast save area   ~/img/screenshots/$(date +%Y-%m-%d_%H%M%S).png
bind = $mod, P,     exec, grimblast save area   ~/img/screenshots/$(date +%Y-%m-%d_%H%M%S).png

# Volume (uses ~/bin/sound like i3, falls back to wpctl)
bindel = CTRL, up,               exec, ~/bin/sound +1 2>/dev/null || wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%+
bindel = CTRL, down,             exec, ~/bin/sound -1 2>/dev/null || wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%-
bindel = , XF86AudioRaiseVolume, exec, ~/bin/sound +1 2>/dev/null || wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%+
bindel = , XF86AudioLowerVolume, exec, ~/bin/sound -1 2>/dev/null || wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%-
bindl  = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Spotify (uses ~/bin/spot like i3)
bindl = , XF86AudioPlay, exec, ~/bin/spot play  2>/dev/null || playerctl play-pause
bindl = , XF86AudioPrev, exec, ~/bin/spot prev  2>/dev/null || playerctl previous
bindl = , XF86AudioNext, exec, ~/bin/spot next  2>/dev/null || playerctl next
bindl = , XF86AudioStop, exec, ~/bin/spot stop  2>/dev/null || playerctl stop

# Brightness
bindel = , XF86MonBrightnessUp,   exec, brightnessctl set 2%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 2%-

# Mouse bindings for floating windows
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow


##############################
### WINDOWS & WORKSPACES   ###
##############################

# Suppress maximize/fullscreen events globally (e.g. apps trying to auto-fullscreen)
windowrule {
    name = suppress_maximize
    match {
        class = .*
    }
    suppress_event = fullscreen maximize
}

# Ignore unidentified XWayland popup windows (prevents focus stealing)
windowrule {
    name = no_xwayland_focus
    match {
        class = ^$
        title = ^$
        xwayland = true
        float = true
    }
    no_focus = true
}
