[note]
language = "en"
default-title = "Untitled"
filename = "{{format-date now '%Y-%m-%d'}}-{{id}}"
extension = "md"
template = "default.md"
id-charset = "alphanum"
id-length = 8
id-case = "lower"

[group]

[group.todo]
paths = ["todo"]

[group.todo.note]
filename = "{{format-date now '%Y-%m-%d'}}"
extension = "md"
template = "todo.md"

[group.task]
paths = ["tasks"]

[group.task.note]
filename = "{{format-date now '%Y-%m-%d'}}-{{id}}"
extension = "md"
template = "task.md"

[group.meeting]
paths = ["meetings"]

[group.meeting.note]
filename = "{{format-date now '%Y-%m-%d-%H%M'}}-{{id}}"
extension = "md"
template = "meeting.md"

[format.markdown]
hashtags = true

[tool]
editor = "vim -c \"silent! /Untitled\" -c 'call search(\"Untitled\")' "
# editor = "vim --clean -c 'syntax on' -c 'hi Normal ctermbg=NONE guibg=NONE' -c \"silent! /Untitled\" -c 'call search(\"Untitled\")' "
# editor = "code -r" # vscode users
pager = "less -FIRX"
fzf-preview = "bat -p --color always {-1}"
fzf-options = "--multi --tiebreak begin --exact --tabstop 4 --height 100% --no-hscroll --color hl:-1,hl+:-1 --preview-window wrap"

[alias]

# Create new note, from templates
n = 'zk new'
meeting = 'zk new --group meeting'
m = 'zk meeting'

# Usage:
# - zk todo - open's todays todo list
# - zk todo next friday
# - zk todo tomorrow
# - zk todo yesterday
todo = 'zk new --group todo --no-input --date "$(date -d "$*" +%Y-%m-%d)" "$ZK_NOTEBOOK_DIR/todo" --template todo.md'

# Usage:
# - zk todos last month - open all todos for the last month
# - zk 2 weeks ago - open all todos over the last two weeks
# - zk -2 week - open all todos over the last two weeks
todos = 'zk edit --sort created- --created-after "$(date -d "$*" +%Y-%m-%d)" todo'

# Tasks (own notes in tasks/, excluded from ls/recent)
# Usage:
# - zk task fix the build   - new task with that title
# - zk task-ls              - open tasks: path, priority, link, title
# - zk task-link            - open the external (linear/jira) link of a picked task
task = 'zk new --group task --title "$*" "$ZK_NOTEBOOK_DIR/tasks"'
task-ls = "zk list tasks --quiet --sort created- --format '{{metadata.status}}|{{metadata.priority}}|{{path}}|{{metadata.link}}|{{title}}' | awk -F'|' '$1==\"open\"' | sort -t'|' -k2,2nr | column -t -s'|'"
task-link = "zk list tasks --quiet --format '{{metadata.link}}|{{title}}' | grep -v '^|' | fzf | cut -d'|' -f1 | xargs xdg-open"

# Find and edit
last = "zk edit --limit 1 --sort modified- $argv"
recent = "zk edit --sort created- --created-after 'last 7 days' --interactive --exclude tasks"
recent-month = "zk edit --sort created- --created-after 'last 30 days' --interactive --exclude tasks"
ls = "zk edit --interactive --sort created --exclude todo --exclude tasks"
t = "zk-tag-search"
ta = "zk edit --tag $(zk tag --quiet | fzf | awk '{print $1}')"

_ls = "zk list --interactive --sort created --quiet --format {{path}}"

# Manage the notes
update = "cd $ZK_NOTEBOOK_DIR; git add -A; git commit -am 'updating'; git pull; git push; cd -"
clean = "zk-clean"
clean-dry = "zk-clean --dry-run"
sync = "zk update && zk index"

# Find all unresolved tasks within a zk tag
open-tasks = "cd $ZK_NOTEBOOK_DIR; zk list --tag $(zk tag --quiet | fzf | awk '{print $1}') --format {{path}} --quiet | xargs rg --no-heading --with-filename -F '[ ]'"
